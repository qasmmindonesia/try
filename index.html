<style>
:root{--o:#F7931E;--y:#FFD21F;--k:#141414}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--k);color:#222}
.bg{min-height:100vh;padding:14px;background:radial-gradient(circle at 12% 8%,#f7931e66,transparent 38%),radial-gradient(circle at 92% 92%,#ffd21f40,transparent 40%),repeating-linear-gradient(135deg,#1c1c1c 0 14px,#151515 14px 28px)}
.bg:before,.bg:after{position:fixed;font-size:9rem;opacity:.07;pointer-events:none;content:"🥩";left:2%;bottom:2%}.bg:after{content:"🔥";left:auto;right:3%;top:3%;bottom:auto}
.card{background:#fff;border-radius:18px;padding:22px;max-width:860px;margin:0 auto 14px;box-shadow:0 10px 30px #0008;animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.logo{display:block;margin:0 auto;max-width:300px;width:80%}
h1{font-size:1.25rem;text-align:center;margin:.4rem 0;color:var(--k)}h1 span{display:block;color:var(--o);font-size:1.05rem}
label{display:block;font-weight:600;margin:12px 0 0}input[type=text],input[type=password],input:not([type]),textarea,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font:inherit;margin-top:4px}
input:focus,textarea:focus{outline:none;border-color:var(--o)}
.btn{display:inline-block;background:var(--o);color:#111;border:0;border-radius:12px;padding:14px 22px;font:700 1rem inherit;cursor:pointer;min-height:48px;transition:.15s}
.btn:hover{background:var(--y)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.dk{background:#222;color:#fff}.btn.sm{padding:8px 12px;min-height:0;font-size:.85rem}.btn.rd{background:#c62828;color:#fff}.btn.w{width:100%;margin-top:18px}
.err{color:#c62828;font-weight:600;margin-top:10px}.ok{color:#2e7d32;font-weight:600}
.top{background:#000;color:#fff;border-bottom:4px solid var(--o);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top h2{margin:0;font-size:1.05rem;color:var(--y)}.top small{display:block;color:#ddd}
.tm{font:800 1.6rem/1 ui-monospace,monospace;color:var(--y);background:#222;padding:10px 16px;border-radius:12px}.tm.low{color:#fff;background:#c62828;animation:bl 1s infinite}@keyframes bl{50%{opacity:.6}}
.ex{display:grid;grid-template-columns:260px 1fr;gap:14px;max-width:1100px;margin:0 auto}.ex .card{margin:0;max-width:none}
@media(max-width:800px){.ex{grid-template-columns:1fr}.ex .mp{order:2}}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.m{border:3px solid transparent;border-radius:9px;padding:9px 0;font-weight:700;color:#fff;cursor:pointer}.m.g{background:#2e9e45}.m.r{background:#d32f2f}.m.cur{border-color:#000;box-shadow:0 0 0 3px var(--y)}
.lg{font-size:.8rem;margin-top:10px;color:#555}
.op{display:flex;gap:10px;align-items:flex-start;border:2px solid #e2e2e2;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;font-weight:500;transition:.15s}.op:hover{border-color:var(--o)}.op.sel{border-color:var(--o);background:#fff3e0}.op input{margin-top:5px;accent-color:var(--o);transform:scale(1.3)}
.qi{max-width:100%;border:1px solid #ddd;border-radius:10px;margin:8px 0}.qt{white-space:pre-wrap;font-size:1.08rem;font-weight:600}.nt{background:#fff3e0;border-left:4px solid var(--o);padding:6px 10px;margin:8px 0;font-size:.9rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.nav .btn{flex:1}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#222;color:var(--y)}.sc{overflow-x:auto}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs .btn{flex:0}.tabs .on{background:var(--k);color:var(--y)}
.aq{border:2px solid #eee;border-radius:12px;padding:12px;margin:12px 0}.aq .r{display:flex;gap:8px;align-items:center;margin-top:6px}.aq .r input[type=radio]{width:auto;margin:0;accent-color:var(--o);transform:scale(1.3)}
.big{text-align:center;font-size:2rem;font-weight:800;color:var(--o)}.kv td:first-child{font-weight:700;width:45%}
